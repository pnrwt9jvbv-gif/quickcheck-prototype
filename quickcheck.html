<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04141A">
<meta name="apple-mobile-web-app-capable" content="yes">


<title>VenomFiz QuickCheck</title>
<style>:root{--bg:#04141A;--card:#0A2A33;--lime:#6DFF3B;--cyan:#19D9B5;--blue:#3AA6F0;--tx:#EAF7F4;--mut:#8FB3B3;--bad:#ff7b7b;--line:#1D4048;--grad:linear-gradient(90deg,#6DFF3B,#19D9B5)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:8px 0 14px}h2{font-size:18px;color:var(--cyan);margin:22px 0 6px}
label{display:block;margin:10px 0;font-size:14px;color:var(--mut)}
input,select{width:100%;min-height:48px;margin-top:4px;padding:10px 12px;background:#031014;color:var(--tx);border:1px solid var(--line);border-radius:12px;font-size:16px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn{display:block;width:100%;min-height:50px;margin:10px 0;border:0;border-radius:14px;background:var(--grad);color:#04141A;font:700 16px system-ui;text-align:center;line-height:50px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid #2d5560}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{display:inline-block;width:auto;min-height:36px;line-height:34px;padding:0 14px;margin:0}
.btn:disabled{opacity:.5}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;display:block;color:inherit;text-decoration:none}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.row>label{flex:1}
.big{font-size:34px;font-weight:800;color:var(--lime)}
.mut{color:var(--mut);font-size:14px}
.err,.warn{padding:10px 12px;border-radius:12px;margin:10px 0}
.err{background:#3a1a1d;border:1px solid var(--bad)}.warn{background:#3a3213;border:1px solid #e8c547}
.ok{color:var(--lime);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;color:var(--tx)}.chk input{width:24px;min-height:24px;margin:0}
.bar{height:10px;background:var(--grad);border-radius:5px;margin-top:6px}
img.rc{max-width:100%;border-radius:12px;margin:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#031014;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:14px 4px;color:var(--mut);text-decoration:none;font-size:13px}
nav a.on{color:var(--lime);font-weight:700;border-top:3px solid var(--lime);margin-top:-1px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--lime);border-radius:12px;padding:12px;text-align:center;display:none;z-index:9}

body{background:var(--bg)}

<script>// IndexedDB wrapper: expenses, items, receipts, wardrobe, changes
const DB=(()=>{
  const S=['expenses','items','receipts','wardrobe','changes','sales','removals'];let db;
  const open=()=>db?Promise.resolve(db):new Promise((res,rej)=>{
    const r=indexedDB.open('quickfix',3) /* name kept so existing saved data stays */;
    r.onupgradeneeded=()=>S.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});
    r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)});
  const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const all=async s=>req((await open()).transaction(s).objectStore(s).getAll());
  const get=async(s,id)=>req((await open()).transaction(s).objectStore(s).get(id));
  // One atomic transaction across all stores; resolves only after data is committed.
  const tx=async fn=>{const d=await open();return new Promise((res,rej)=>{
    const t=d.transaction(S,'readwrite');
    try{fn(n=>t.objectStore(n))}catch(e){t.abort();return rej(e)}
    t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Save cancelled'))})};
  return{S,all,get,tx};
})();

// QuickCheck prototype: screens, purchase flow, wardrobe logic. Money is stored as integer sen.
const app=document.getElementById('app'),screens={};
let draft=null,filter='All';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+crypto.randomUUID();
const sen=x=>Math.round(parseFloat(x)*100);
const RM=n=>'RM '+(n/100).toFixed(2);
const CATS=['Clothing','Food','Transport','Bills','Health','Entertainment','Other'];
const WCATS=['Tops','Bottoms','Outerwear','Footwear','Accessories','Other'];
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const v=id=>document.getElementById(id)?.value??'';
const F=(id,l,val,a='')=>`<label>${l}<input id="${id}" value="${esc(val)}" ${a}></label>`;
const SEL=(id,l,o,val)=>`<label>${l}<select id="${id}">${o.map(x=>`<option ${x==val?'selected':''}>${x}</option>`).join('')}</select></label>`;
const empty=(t,b,h)=>`<div class="card"><p>${t}</p>${h?`<a class="btn" href="${h}">${b}</a>`:''}</div>`;
function toast(m,undo){const t=document.getElementById('toast');t.innerHTML=esc(m)+(undo?' <button class="btn sm" onclick="undoRm()">Undo</button>':'');t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',undo?7000:2500)}
const monthKey=d=>d.slice(0,7);
const keyOf=x=>[x.name,x.size,x.color].map(s=>String(s||'').trim().toLowerCase()).join('|');

/* ---------- Home ---------- */
screens.home=async()=>{
  const ex=(await DB.all('expenses')).sort((a,b)=>b.purchaseDate.localeCompare(a.purchaseDate)||b.createdAt.localeCompare(a.createdAt));
  const m=today().slice(0,7),tot=ex.filter(e=>monthKey(e.purchaseDate)===m).reduce((s,e)=>s+e.totalAmount,0);
  app.innerHTML=`<div class="row"><div><h1 class="brand">VenomFiz</h1><div style="font-size:20px;font-weight:700">QuickCheck</div></div><a class="btn ghost sm" href="#/settings" aria-label="Settings">Settings</a></div>
  <div class="card about"><b>Check what you own before you buy more.</b>
  <p>It's hard to remember every piece in your wardrobe at home, so people often buy clothes they already have. QuickCheck keeps a simple list of the clothes you still own, so you can look before you shop and avoid buying the same thing twice.</p>
  <p>When you buy something new, record it right after you pay and attach a photo or screenshot of the receipt, paper or digital. Tick "Add to MyWardrobe" and the new clothes join your list.</p></div>
  <div class="card"><div class="mut">Spent this month</div><div class="big">${RM(tot)}</div></div>
  <a class="btn" href="#/add" onclick="draft=null">Record purchase</a>
  <h2>Recent purchases</h2>${ex.length?ex.slice(0,5).map(expRow).join(''):empty('No purchases yet. Record your first one to start tracking.','Record purchase','#/add')}`};
const expRow=e=>`<a class="card row" href="#/expense/${e.id}"><div><b>${esc(e.merchant)}</b><div class="mut">${e.purchaseDate} · ${esc(e.category)}</div></div><b>${RM(e.totalAmount)}</b></a>`;

/* ---------- Purchase form ---------- */
const newDraft=()=>({merchant:'',date:today(),total:'',cat:'Clothing',pay:'Card',notes:'',items:[],file:null,url:null});
const blankItem=()=>({name:'',cat:'Clothing',qty:'1',price:'',w:false,wc:'Tops',size:'',color:''});
function collect(){if(!draft||!document.getElementById('m'))return;const d=draft;
  d.merchant=v('m');d.date=v('d');d.total=v('t');d.cat=v('c');d.pay=v('p');d.notes=v('n');
  d.items.forEach((it,i)=>{it.name=v('in'+i);it.cat=v('ic'+i);it.qty=v('iq'+i);it.price=v('ip'+i);
    it.w=document.getElementById('iw'+i).checked;if(it.w){it.wc=v('iwc'+i);it.size=v('is'+i);it.color=v('ik'+i)}})}
const lineT=(q,p)=>{const a=Number(q),b=sen(p);return Number.isInteger(a)&&a>0&&isFinite(b)?a*b:0};
function lt(i){document.getElementById('lt'+i).textContent='Line total: '+RM(lineT(v('iq'+i),v('ip'+i)))}
const itemRow=(it,i)=>`<div class="card"><div class="row"><b>Item ${i+1}</b><button class="btn bad sm" onclick="rmItem(${i})">Remove</button></div>
 ${F('in'+i,'Name',it.name)}${SEL('ic'+i,'Category',CATS,it.cat)}
 <div class="row">${F('iq'+i,'Quantity',it.qty,'type="number" min="1" step="1" inputmode="numeric" oninput="lt('+i+')"')}${F('ip'+i,'Unit price (MYR)',it.price,'inputmode="decimal" oninput="lt('+i+')"')}</div><div class="mut" id="lt${i}">Line total: ${RM(lineT(it.qty,it.price))}</div>
 <label class="chk"><input type="checkbox" id="iw${i}" ${it.w?'checked':''} onchange="tg()"> Add to MyWardrobe</label>
 ${it.w?SEL('iwc'+i,'Wardrobe type',WCATS,it.wc)+`<div class="row">${F('is'+i,'Size',it.size)}${F('ik'+i,'Colour',it.color)}</div>`:''}</div>`;
screens.add=()=>{draft=draft||newDraft();const d=draft;
  app.innerHTML=`<h1>Record purchase</h1><div id="err"></div>
  ${F('m','Shop or merchant *',d.merchant)}${F('d','Date *',d.date,'type="date"')}${F('t','Total (MYR) *',d.total,'inputmode="decimal"')}
  ${SEL('c','Category *',CATS,d.cat)}${SEL('p','Payment method',['Cash','Card','E-wallet','Bank transfer','Other'],d.pay)}${F('n','Notes',d.notes)}
  <h2>Items (optional)</h2>${d.items.map(itemRow).join('')}
  <button class="btn ghost" onclick="addItem()">Add item</button>
  <h2>Receipt (optional)</h2>
  ${d.url?`<img class="rc" src="${d.url}" alt="Receipt preview"><button class="btn ghost" onclick="rmReceipt()">Remove receipt</button>`:''}
  <label>${d.url?'Replace receipt':'Choose or take a photo'}<input type="file" accept="image/*" onchange="pick(this)"></label>
  <button class="btn" onclick="review()">Review purchase</button><button class="btn ghost" onclick="cancel()">Cancel</button>`};
function addItem(){collect();draft.items.push(blankItem());route()}
function rmItem(i){collect();draft.items.splice(i,1);route()}
function tg(){collect();route()}
function pick(el){const f=el.files[0];if(!f)return;collect();if(draft.url)URL.revokeObjectURL(draft.url);draft.file=f;draft.url=URL.createObjectURL(f);route()}
function rmReceipt(){collect();draft.file=null;draft.url=null;route()}
function cancel(){if(confirm('Discard this purchase?')){draft=null;location.hash='#/home'}}
const itemsSum=d=>d.items.reduce((s,i)=>s+Number(i.qty)*sen(i.price),0);
function validate(d){const e=[];
  if(!d.merchant.trim())e.push('Enter the shop name.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date))e.push('Choose a valid date.');
  const t=parseFloat(d.total);if(!isFinite(t)||t<=0)e.push('Total must be greater than 0.');
  d.items.forEach((it,i)=>{const n=i+1,q=Number(it.qty),p=parseFloat(it.price);
    if(!it.name.trim())e.push(`Item ${n}: enter a name.`);
    if(!Number.isInteger(q)||q<1)e.push(`Item ${n}: quantity must be a whole number, 1 or more.`);
    if(!isFinite(p)||p<0)e.push(`Item ${n}: enter a valid unit price.`)});return e}
function review(){collect();const e=validate(draft);
  if(e.length){document.getElementById('err').innerHTML=`<div class="err" role="alert"><b>Fix these first:</b><br>${e.map(esc).join('<br>')}</div>`;scrollTo(0,0);return}
  location.hash='#/review'}

/* ---------- Review & save ---------- */
screens.review=()=>{if(!draft)return location.hash='#/add';const d=draft,diff=d.items.length&&itemsSum(d)!==sen(d.total);
  app.innerHTML=`<h1>Review purchase</h1>
  <div class="card"><div class="row"><b>${esc(d.merchant)}</b><b>${RM(sen(d.total))}</b></div>
  <div class="mut">${d.date} · ${esc(d.cat)} · ${esc(d.pay)}</div>${d.notes?`<p>${esc(d.notes)}</p>`:''}</div>
  ${diff?`<div class="warn" role="alert">Warning: item lines add up to ${RM(itemsSum(d))}, but the total is ${RM(sen(d.total))}. Go back to correct it, or confirm to save as entered.</div>`:''}
  ${d.items.map(i=>`<div class="card row"><div>${esc(i.name)}<div class="mut">${i.qty} × ${RM(sen(i.price))} = ${RM(Number(i.qty)*sen(i.price))}${i.w?` · Adds to MyWardrobe (${esc(i.size||'no size')}, ${esc(i.color||'no colour')})`:''}</div></div></div>`).join('')}
  ${d.url?`<img class="rc" src="${d.url}" alt="Receipt">`:'<p class="mut">No receipt attached.</p>'}
  <button class="btn" id="cf" onclick="save()">Confirm and save</button><a class="btn ghost" href="#/add">Back to edit</a>`};
async function save(){const btn=document.getElementById('cf');btn.disabled=true;
  try{const d=draft,eid=uid('exp'),rid=d.file?uid('rcp'):null,now=new Date().toISOString();
    const wd=await DB.all('wardrobe'),map=new Map(wd.map(x=>[keyOf(x),x])),puts=new Set(),chg=[];
    const exp={id:eid,merchant:d.merchant.trim(),purchaseDate:d.date,currency:'MYR',totalAmount:sen(d.total),category:d.cat,paymentMethod:d.pay,notes:d.notes,receiptId:rid,createdAt:now,updatedAt:now};
    const items=d.items.map(i=>({id:uid('item'),expenseId:eid,name:i.name.trim(),category:i.cat,quantity:Number(i.qty),unitPrice:sen(i.price),lineTotal:Number(i.qty)*sen(i.price),addToWardrobe:i.w}));
    d.items.forEach((i,n)=>{if(!i.w)return;const q=Number(i.qty),k=keyOf({name:i.name,size:i.size,color:i.color});let rec=map.get(k);
      const up=sen(i.price);if(rec){rec.cost=rec.cost==null?up:Math.round((rec.cost*rec.quantity+up*q)/(rec.quantity+q));rec.quantity+=q;rec.purchaseDate=[rec.purchaseDate||rec.createdAt.slice(0,10),d.date].sort()[0];rec.updatedAt=now}
      else{rec={id:uid('wd'),name:i.name.trim(),brand:'',category:i.wc,size:i.size.trim(),color:i.color.trim(),quantity:q,condition:'New',cost:up,purchaseDate:d.date,sourceExpenseId:eid,createdAt:now,updatedAt:now};map.set(k,rec)}
      puts.add(rec);chg.push({id:uid('chg'),wardrobeItemId:rec.id,expenseId:eid,change:q,reason:'Purchase',date:d.date})});
    await DB.tx(s=>{s('expenses').put(exp);items.forEach(r=>s('items').put(r));
      if(rid)s('receipts').put({id:rid,expenseId:eid,fileName:d.file.name,mimeType:d.file.type,createdAt:now,imageData:d.file});
      puts.forEach(w=>s('wardrobe').put(w));chg.forEach(c=>s('changes').put(c))});
    draft=null;location.hash='#/done/'+eid;
  }catch(e){btn.disabled=false;app.insertAdjacentHTML('afterbegin',`<div class="err" role="alert">Not saved: ${esc(e.message)}. Your entries are still here, so you can try again.</div>`)}}
screens.done=async id=>{app.innerHTML=`<h1 class="ok">Purchase saved</h1><p>Your purchase was stored on this device.</p>
  <a class="btn" href="#/expense/${id}">View purchase</a><a class="btn ghost" href="#/wardrobe">Open MyWardrobe</a><a class="btn ghost" href="#/add" onclick="draft=null">Record another</a>`};

/* ---------- Expenses ---------- */
screens.expenses=async()=>{
  const ex=(await DB.all('expenses')).filter(e=>filter==='All'||e.category===filter).sort((a,b)=>b.purchaseDate.localeCompare(a.purchaseDate)||b.createdAt.localeCompare(a.createdAt));
  app.innerHTML=`<div class="row"><h1>Expenses</h1><a class="btn sm" href="#/add" onclick="draft=null">Record</a></div>
  <label>Filter by category<select onchange="filter=this.value;route()">${['All',...CATS].map(c=>`<option ${c===filter?'selected':''}>${c}</option>`).join('')}</select></label>
  ${ex.length?ex.map(expRow).join(''):empty(filter==='All'?'No purchases yet.':'No purchases in this category.','Record purchase','#/add')}`};
screens.expense=async id=>{
  const e=await DB.get('expenses',id);if(!e)return app.innerHTML=empty('This purchase no longer exists.','Back to expenses','#/expenses');
  const its=(await DB.all('items')).filter(i=>i.expenseId===id),r=e.receiptId?await DB.get('receipts',e.receiptId):null;
  app.innerHTML=`<h1>${esc(e.merchant)}</h1><div class="big">${RM(e.totalAmount)}</div><div id="err"></div>
  ${its.length?`<h2>Items</h2>${its.map(i=>`<div class="card row"><div>${esc(i.name)}<div class="mut">${i.quantity} × ${RM(i.unitPrice)} = ${RM(i.lineTotal)}${i.addToWardrobe?' · Added to MyWardrobe':''}</div></div></div>`).join('')}`:'<p class="mut">No item details recorded.</p>'}
  ${r?`<h2>Receipt</h2><img class="rc" src="${URL.createObjectURL(r.imageData)}" alt="Receipt">`:''}
  <h2>Edit details</h2><p class="mut">Items and wardrobe records are not changed by edits here.</p>
  ${F('m','Shop or merchant',e.merchant)}${F('d','Date',e.purchaseDate,'type="date"')}${F('t','Total (MYR)',(e.totalAmount/100).toFixed(2),'inputmode="decimal"')}
  ${SEL('c','Category',CATS,e.category)}${SEL('p','Payment method',['Cash','Card','E-wallet','Bank transfer','Other'],e.paymentMethod)}${F('n','Notes',e.notes)}
  <button class="btn" onclick="updExp('${id}')">Save changes</button><button class="btn bad" onclick="delExp('${id}')">Delete purchase</button>`};
async function updExp(id){const e=await DB.get('expenses',id),d={merchant:v('m'),date:v('d'),total:v('t')},er=validate({...d,items:[]});
  if(er.length)return document.getElementById('err').innerHTML=`<div class="err" role="alert">${er.map(esc).join('<br>')}</div>`;
  Object.assign(e,{merchant:d.merchant.trim(),purchaseDate:d.date,totalAmount:sen(d.total),category:v('c'),paymentMethod:v('p'),notes:v('n'),updatedAt:new Date().toISOString()});
  try{await DB.tx(s=>s('expenses').put(e));toast('Changes saved');route()}catch(x){toast('Not saved: '+x.message)}}
async function delExp(id){if(!confirm('Delete this purchase?'))return;
  const [its,chg,wd]=await Promise.all([DB.all('items'),DB.all('changes'),DB.all('wardrobe')]),e=await DB.get('expenses',id);
  const mine=chg.filter(c=>c.expenseId===id&&c.reason==='Purchase');
  const undo=mine.length&&confirm('This purchase added clothing to MyWardrobe.\n\nOK = also remove those quantities\nCancel = keep the clothing');
  const now=new Date().toISOString();
  try{await DB.tx(s=>{s('expenses').delete(id);its.filter(i=>i.expenseId===id).forEach(i=>s('items').delete(i.id));if(e.receiptId)s('receipts').delete(e.receiptId);
      mine.forEach(c=>{if(undo){const w=wd.find(x=>x.id===c.wardrobeItemId);if(w){const dec=Math.min(w.quantity,c.change);w.quantity-=dec;w.updatedAt=now;s('wardrobe').put(w);
        s('changes').put({id:uid('chg'),wardrobeItemId:w.id,expenseId:null,change:-dec,reason:'Purchase deleted',date:today()})}}
        s('changes').put({...c,expenseId:null})});
      wd.filter(w=>w.sourceExpenseId===id).forEach(w=>s('wardrobe').put({...w,quantity:wd.find(x=>x.id===w.id).quantity,sourceExpenseId:null}))});
    toast('Purchase deleted');location.hash='#/expenses'}catch(x){toast('Not deleted: '+x.message)}}

/* ---------- MyWardrobe ---------- */
// Age counts from the purchase date (start of that day) to the current moment; recalculated every time a screen opens.
function ageOf(ds){const a=new Date(ds+'T00:00:00'),n=new Date();let y=n.getFullYear()-a.getFullYear(),m=n.getMonth()-a.getMonth(),d=n.getDate()-a.getDate();
  if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}
  if(y<0)return'Purchase date is in the future';const p=[];if(y)p.push(y+(y>1?' years':' year'));if(m)p.push(m+(m>1?' months':' month'));if(d)p.push(d+(d>1?' days':' day'));return p.length?p.join(', '):'Less than 1 day'}
const wdDate=(w,em)=>w.purchaseDate||em?.get(w.sourceExpenseId)||w.createdAt.slice(0,10);
screens.wardrobe=async()=>{const w=(await DB.all('wardrobe')).sort((a,b)=>a.name.localeCompare(b.name)),em=new Map((await DB.all('expenses')).map(e=>[e.id,e.purchaseDate]));
  app.innerHTML=`<div class="row"><h1>MyWardrobe</h1><a class="btn sm" href="#/wd/new">Add item</a></div>
  ${w.length?w.map(x=>`<div class="swipe"><button class="btn bad rm" onclick="quickRemove('${x.id}')" aria-label="Remove ${esc(x.name)}">Remove</button><a class="card row" href="#/wd/${x.id}"><div><b>${esc(x.name)}</b><div class="mut">${esc(x.category)} · ${esc(x.size||'no size')} · ${esc(x.color||'no colour')}</div><div class="mut">Age: ${ageOf(wdDate(x,em))}</div></div><b>${x.quantity===0?'Out':'× '+x.quantity}</b></a></div>`).join(''):empty('Your wardrobe is empty. Tick "Add to MyWardrobe" on a clothing item when you record a purchase, or add one by hand.','Add item','#/wd/new')}`};
screens.wd=async id=>{const isNew=id==='new',w=isNew?{name:'',brand:'',category:'Tops',size:'',color:'',condition:'New',cost:null,quantity:1}:await DB.get('wardrobe',id);
  if(!w)return app.innerHTML=empty('This item no longer exists.','Back to MyWardrobe','#/wardrobe');
  const em=new Map((await DB.all('expenses')).map(e=>[e.id,e.purchaseDate])),pd=isNew?today():wdDate(w,em);
  const hist=isNew?[]:(await DB.all('changes')).filter(c=>c.wardrobeItemId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const sales=isNew?[]:(await DB.all('sales')).filter(s=>s.wardrobeItemId===id).sort((a,b)=>b.date.localeCompare(a.date));
  app.innerHTML=`<h1>${isNew?'Add wardrobe item':esc(w.name)}</h1>${isNew?'':`<p class="mut">Age: <b>${ageOf(pd)}</b> (since ${pd})</p>`}<div id="err"></div>
  ${F('wn','Name *',w.name)}${F('wb','Brand',w.brand)}${SEL('wc','Type',WCATS,w.category)}
  <div class="row">${F('ws','Size',w.size)}${F('wk','Colour',w.color)}</div>${SEL('wo','Condition',['New','Good','Worn'],w.condition)}${F('wcost','Cost per piece (MYR, optional)',w.cost==null?'':(w.cost/100).toFixed(2),'inputmode="decimal"')}${F('wdate','Purchase date',pd,'type="date"')}
  ${isNew?F('wq','Quantity',1,'type="number" min="1" step="1" inputmode="numeric"'):`<h2>Quantity: ${w.quantity}</h2><div class="row"><button class="btn ghost" onclick="adj('${id}',-1)">Remove one</button><button class="btn ghost" onclick="adj('${id}',1)">Add one</button></div>`}
  <button class="btn" onclick="saveWd('${id}')">Save item</button>
  ${isNew||w.quantity<1?'':sellForm(w)}
  ${isNew?'':`<button class="btn bad" onclick="delWd('${id}')">Delete item</button>${sales.length?`<h2>Sales</h2>${sales.map(saleRow).join('')}`:''}<h2>History</h2>${hist.map(c=>`<div class="mut">${c.date} · ${c.change>0?'+':''}${c.change} · ${esc(c.reason)}</div>`).join('')||'<p class="mut">No changes yet.</p>'}`}`};
async function saveWd(id){const isNew=id==='new',now=new Date().toISOString(),q=Number(v('wq'));
  if(!v('wn').trim())return document.getElementById('err').innerHTML='<div class="err" role="alert">Enter a name.</div>';
  if(isNew&&(!Number.isInteger(q)||q<1))return document.getElementById('err').innerHTML='<div class="err" role="alert">Quantity must be a whole number, 1 or more.</div>';
  const cs=v('wcost').trim();if(cs!==''&&!(parseFloat(cs)>=0))return document.getElementById('err').innerHTML='<div class="err" role="alert">Cost must be a valid amount.</div>';
  const w=isNew?{id:uid('wd'),quantity:q,sourceExpenseId:null,createdAt:now}:await DB.get('wardrobe',id);
  Object.assign(w,{name:v('wn').trim(),brand:v('wb'),category:v('wc'),size:v('ws').trim(),color:v('wk').trim(),condition:v('wo'),cost:cs===''?null:sen(cs),purchaseDate:v('wdate')||today(),updatedAt:now});
  try{await DB.tx(s=>{s('wardrobe').put(w);if(isNew)s('changes').put({id:uid('chg'),wardrobeItemId:w.id,expenseId:null,change:q,reason:'Added manually',date:today()})});
    toast('Item saved');location.hash='#/wardrobe'}catch(e){toast('Not saved: '+e.message)}}
async function adj(id,n){const w=await DB.get('wardrobe',id);if(w.quantity+n<0)return toast('Quantity cannot go below 0');
  w.quantity+=n;w.updatedAt=new Date().toISOString();
  try{await DB.tx(s=>{s('wardrobe').put(w);s('changes').put({id:uid('chg'),wardrobeItemId:id,expenseId:null,change:n,reason:n>0?'Adjustment (added)':'Removed or given away',date:today()})});route()}catch(e){toast('Not saved: '+e.message)}}
async function delWd(id){if(!confirm('Remove this item from MyWardrobe? You can undo right after.'))return;await quickRemove(id);location.hash='#/wardrobe'}

/* ---------- Swipe-to-remove (MyWardrobe list) ---------- */
let sx=0,sy=0,swiped=false,lastRm=null;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
document.addEventListener('touchend',e=>{const r=e.target.closest('.swipe');if(!r)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<50||Math.abs(dy)>40)return;
  document.querySelectorAll('.swipe.open').forEach(o=>o!==r&&o.classList.remove('open'));r.classList.toggle('open',dx<0);swiped=true;setTimeout(()=>swiped=false,400)});
document.addEventListener('click',e=>{const r=e.target.closest('.swipe');if(!r||e.target.closest('.rm'))return;
  if(swiped||r.classList.contains('open')){e.preventDefault();swiped=false;r.classList.remove('open')}},true);
async function quickRemove(id){const w=await DB.get('wardrobe',id),ch=(await DB.all('changes')).filter(c=>c.wardrobeItemId===id);
  const rmv=w.quantity>0?{id:uid('rmv'),wardrobeItemId:id,itemName:w.name,quantity:w.quantity,costPerPiece:w.cost??null,date:today(),createdAt:new Date().toISOString()}:null;
  try{await DB.tx(s=>{s('wardrobe').delete(id);ch.forEach(c=>s('changes').delete(c.id));if(rmv)s('removals').put(rmv)});lastRm={w,ch,rmv};toast('Removed '+w.name,true);route()}catch(e){toast('Not removed: '+e.message)}}
async function undoRm(){if(!lastRm)return;const{w,ch,rmv}=lastRm;
  try{await DB.tx(s=>{s('wardrobe').put(w);ch.forEach(c=>s('changes').put(c));if(rmv)s('removals').delete(rmv.id)});lastRm=null;toast('Item restored');route()}catch(e){toast('Not restored: '+e.message)}}

/* ---------- Selling ---------- */
function sellForm(w){return `<h2>Sell this item</h2><p class="mut">Record pieces sold to someone else. They leave your wardrobe count and appear in Insights.</p><div id="serr"></div>
  <div class="row">${F('sq','Quantity sold',1,'type="number" min="1" max="'+w.quantity+'" step="1" inputmode="numeric"')}${F('sp','Sale price per piece (MYR)','','inputmode="decimal"')}</div>
  ${F('sb','Sold to (optional)','')}${F('sd','Date',today(),'type="date"')}<button class="btn ghost" onclick="sell('${w.id}')">Record sale</button>`}
const saleRow=s=>`<div class="card"><div class="row"><div>${s.quantity} × ${RM(s.unitPrice)} = <b>${RM(s.totalAmount)}</b><div class="mut">${s.date}${s.buyer?' · '+esc(s.buyer):''}</div></div><button class="btn bad sm" onclick="undoSale('${s.id}')">Undo</button></div></div>`;
async function sell(id){const w=await DB.get('wardrobe',id),q=Number(v('sq')),p=parseFloat(v('sp')),d=v('sd'),e=[];
  if(!Number.isInteger(q)||q<1)e.push('Quantity sold must be a whole number, 1 or more.');else if(q>w.quantity)e.push(`You only have ${w.quantity} of this item.`);
  if(!isFinite(p)||p<=0)e.push('Enter the sale price per piece (more than 0).');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d))e.push('Choose a valid date.');
  if(e.length)return document.getElementById('serr').innerHTML=`<div class="err" role="alert">${e.map(esc).join('<br>')}</div>`;
  const up=sen(p),now=new Date().toISOString(),sid=uid('sale');w.quantity-=q;w.updatedAt=now;
  const sale={id:sid,wardrobeItemId:id,itemName:w.name,quantity:q,unitPrice:up,totalAmount:q*up,costPerPiece:w.cost??null,buyer:v('sb').trim(),date:d,createdAt:now};
  try{await DB.tx(s=>{s('wardrobe').put(w);s('sales').put(sale);s('changes').put({id:uid('chg'),wardrobeItemId:id,expenseId:null,saleId:sid,change:-q,reason:'Sold',date:d})});toast('Sale recorded');route()}catch(x){toast('Not saved: '+x.message)}}
async function undoSale(sid){if(!confirm('Undo this sale and return the pieces to your wardrobe?'))return;
  const s0=await DB.get('sales',sid),w=await DB.get('wardrobe',s0.wardrobeItemId);
  try{await DB.tx(s=>{s('sales').delete(sid);if(w){w.quantity+=s0.quantity;w.updatedAt=new Date().toISOString();s('wardrobe').put(w);s('changes').put({id:uid('chg'),wardrobeItemId:w.id,expenseId:null,change:s0.quantity,reason:'Sale undone',date:today()})}});toast('Sale undone');route()}catch(x){toast('Not saved: '+x.message)}}
function wardrobeCards(wd,rv){const m=today().slice(0,7),rm=rv.filter(r=>monthKey(r.date)===m),pcs=wd.reduce((t,w)=>t+w.quantity,0),
  val=wd.reduce((t,w)=>t+(w.cost!=null?w.cost*w.quantity:0),0),unk=wd.filter(w=>w.cost==null&&w.quantity>0).length,
  rp=rm.reduce((t,r)=>t+r.quantity,0),rc=rm.filter(r=>r.costPerPiece!=null).reduce((t,r)=>t+r.costPerPiece*r.quantity,0);
  return `<h2>MyWardrobe</h2><div class="card"><div class="mut">Clothing in MyWardrobe</div><b>${pcs}</b> piece(s)</div>
  <div class="card"><div class="row"><span>Wardrobe value at cost</span><b>${RM(val)}</b></div>${unk?`<div class="mut">${unk} item(s) have no recorded cost and are not counted.</div>`:''}</div>
  <div class="card"><div class="row"><span>Removed this month</span><b>${rp} piece(s)</b></div><div class="mut">Cost of removed pieces: ${RM(rc)}</div></div>`}
function salesCards(sl,mo){const m=today().slice(0,7),sm=sl.filter(s=>monthKey(s.date)===m),sum=(a,f)=>a.reduce((t,x)=>t+f(x),0),rev=a=>sum(a,s=>s.totalAmount);
  const known=sm.filter(s=>s.costPerPiece!=null),profit=sum(known,s=>s.totalAmount-s.costPerPiece*s.quantity),spend=sum(mo,e=>e.totalAmount);
  return `<h2>Sales</h2><div class="card"><div class="mut">Sold this month</div><div class="big">${RM(rev(sm))}</div><div class="mut">${sum(sm,s=>s.quantity)} piece(s) in ${sm.length} sale(s)</div></div>
  <div class="card row"><span>Spending after sales (this month)</span><b>${RM(spend-rev(sm))}</b></div>
  <div class="card"><div class="row"><span>${profit<0?'Loss':'Profit'} on sales (this month)</span><b>${RM(Math.abs(profit))}</b></div><div class="mut">${known.length===sm.length?'Based on recorded purchase cost.':'Based on '+known.length+' of '+sm.length+' sale(s) that have a recorded cost.'}</div></div>
  <div class="card row"><span>All-time sales</span><b>${RM(rev(sl))}</b></div>`}

/* ---------- Insights & Settings ---------- */
screens.insights=async()=>{const ex=await DB.all('expenses'),wd=await DB.all('wardrobe'),sl=await DB.all('sales'),rv=await DB.all('removals'),m=today().slice(0,7),mo=ex.filter(e=>monthKey(e.purchaseDate)===m);
  const by={};mo.forEach(e=>by[e.category]=(by[e.category]||0)+e.totalAmount);const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=rows[0]?.[1]||1;
  app.innerHTML=`<h1>Insights</h1><a class="card" href="#/month" aria-label="Open this month's breakdown"><div class="mut">This month</div><div class="big">${RM(mo.reduce((s,e)=>s+e.totalAmount,0))}</div><div class="mut">${mo.length} purchase(s) · Tap for breakdown</div></a>
  <div class="card"><div class="mut">All time</div><b>${RM(ex.reduce((s,e)=>s+e.totalAmount,0))}</b> across ${ex.length} purchase(s)</div>
  ${salesCards(sl,mo)}${wardrobeCards(wd,rv)}
  <h2>This month by category</h2>${rows.length?rows.map(([c,a])=>`<div class="card"><div class="row"><span>${esc(c)}</span><b>${RM(a)}</b></div><div class="bar" style="width:${Math.max(4,a/mx*100)}%"></div></div>`).join(''):empty('Nothing recorded this month yet.','Record purchase','#/add')}`};
screens.settings=()=>{app.innerHTML=`<h1>Settings and privacy</h1>
  <div class="card"><p>QuickCheck is a local prototype. Your records live only in this browser on this device. They do not sync, and clearing site data deletes them. Do not store sensitive real financial data yet.</p></div>
  <button class="btn ghost" onclick="seedClothing()">Replace data with random sample clothing</button><button class="btn" onclick="exportData()">Export data (JSON)</button><button class="btn bad" onclick="clearAll()">Clear all data</button><a class="btn ghost" href="#/home">Back</a>`};
async function exportData(){try{const o={exportedAt:new Date().toISOString()};
  for(const s of DB.S){o[s]=(await DB.all(s)).map(r=>s==='receipts'?{...r,imageData:'[image not exported]'}:r)}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='quickcheck-export.json';a.click();toast('Export created')}catch(e){toast('Export failed: '+e.message)}}
async function clearAll(){if(!confirm('Delete ALL QuickCheck data on this device? This cannot be undone.'))return;
  try{await DB.tx(s=>DB.S.forEach(n=>s(n).clear()));toast('All data cleared');location.hash='#/home';route()}catch(e){toast('Failed: '+e.message)}}

/* ---------- This month breakdown (pie chart) ---------- */
const COL=['#6DFF3B','#19D9B5','#3AA6F0','#9B8CFF','#FF8FD0','#8FE3FF','#C4D6D6'],SOLD_COL='#FFC247';
function pie(sl){const tot=sl.reduce((t,x)=>t+x.v,0);if(!tot)return'';let a=-Math.PI/2;const R=90,cx=100,cy=100;
  const parts=sl.filter(x=>x.v>0).map(x=>{const f=x.v/tot;if(f>=.9999)return `<circle cx="100" cy="100" r="90" fill="${x.c}"/>`;
    const b=a+f*2*Math.PI,p=`M${cx} ${cy}L${cx+R*Math.cos(a)} ${cy+R*Math.sin(a)}A${R} ${R} 0 ${f>.5?1:0} 1 ${cx+R*Math.cos(b)} ${cy+R*Math.sin(b)}Z`;a=b;
    return `<path d="${p}" fill="${x.c}" stroke="#04141A" stroke-width="2"/>`}).join('');
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Pie chart of this month's spending by category and sales income" style="width:min(80vw,280px);display:block;margin:12px auto">${parts}</svg>`}
screens.month=async()=>{const m=today().slice(0,7),ex=(await DB.all('expenses')).filter(e=>monthKey(e.purchaseDate)===m),ids=new Set(ex.map(e=>e.id)),
  its=(await DB.all('items')).filter(i=>ids.has(i.expenseId)),sold=(await DB.all('sales')).filter(s=>monthKey(s.date)===m).sort((a,b)=>b.date.localeCompare(a.date));
  const by={};ex.forEach(e=>by[e.category]=(by[e.category]||0)+e.totalAmount);
  const spend=ex.reduce((t,e)=>t+e.totalAmount,0),income=sold.reduce((t,s)=>t+s.totalAmount,0),tot=spend+income;
  const sl=CATS.filter(c=>by[c]).map(c=>({l:c+' (spent)',v:by[c],c:COL[CATS.indexOf(c)]}));if(income)sl.push({l:'Sold items (income)',v:income,c:SOLD_COL});
  const noItems=ex.filter(e=>!its.some(i=>i.expenseId===e.id)).length,exMap=new Map(ex.map(e=>[e.id,e]));
  app.innerHTML=`<a class="btn ghost sm" href="#/insights">Back to Insights</a><h1>This month</h1>
  ${tot?`${pie(sl)}<p class="mut">Each slice is its share of this month's money moving: spending by category plus income from sold items.</p>
  ${sl.map(x=>`<div class="card row"><span><span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${x.c};vertical-align:middle;margin-right:8px"></span>${esc(x.l)}</span><b>${RM(x.v)} · ${Math.round(x.v/tot*100)}%</b></div>`).join('')}`:empty('Nothing recorded this month yet.','Record purchase','#/add')}
  <h2>Totals</h2><div class="card row"><span>Total expenses</span><b>${RM(spend)}</b></div><div class="card row"><span>Sold items (income)</span><b>${RM(income)}</b></div>
  <div class="card row"><span>${spend-income<0?'Net gain':'Net spending'}</span><b>${RM(Math.abs(spend-income))}</b></div>
  <h2>Purchased items</h2>${its.length?its.map(i=>`<div class="card"><div class="row"><span>${esc(i.name)} × ${i.quantity}</span><b>${RM(i.lineTotal)}</b></div><div class="mut">${esc(exMap.get(i.expenseId)?.merchant||'')} · ${exMap.get(i.expenseId)?.purchaseDate||''}</div></div>`).join(''):'<p class="mut">No itemised purchases this month.</p>'}
  ${noItems?`<p class="mut">${noItems} purchase(s) have no item details but are included in the totals.</p>`:''}
  <h2>Sold items</h2>${sold.length?sold.map(s=>`<div class="card"><div class="row"><span>${esc(s.itemName)} × ${s.quantity}</span><b>${RM(s.totalAmount)}</b></div><div class="mut">${s.date}${s.buyer?' · '+esc(s.buyer):''}</div></div>`).join(''):'<p class="mut">No sales this month.</p>'}`};

/* ---------- Random sample clothing data (demo) ---------- */
async function seedClothing(){
  if(!confirm('This deletes ALL current data and replaces it with random sample clothing purchases and wardrobe items. Continue?'))return;
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)],dAgo=n=>new Date(Date.now()-n*864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const BASE=[['Black T-shirt','Tops',25,60],['White T-shirt','Tops',25,55],['Polo shirt','Tops',45,110],['Hoodie','Outerwear',70,160],['Denim jacket','Outerwear',120,280],['Slim jeans','Bottoms',80,180],['Chino pants','Bottoms',70,150],['Cargo shorts','Bottoms',40,95],['Running shoes','Footwear',150,350],['Canvas sneakers','Footwear',90,210],['Baseball cap','Accessories',20,50],['Leather belt','Accessories',30,90]];
  const COLORS=['Black','White','Navy','Grey','Olive','Beige','Blue'],SHOPS=['Urban Threads','Style Hub','Fashion Mart','Daily Wear Co','Street Label'],PAY=['Cash','Card','E-wallet'];
  const sizesOf=t=>t==='Footwear'?['40','41','42','43','44']:t==='Accessories'?['One size']:['S','M','L','XL'];
  const now=new Date().toISOString(),exps=[],items=[],chg=[],wmap=new Map(),n=R(6,8);
  for(let k=0;k<n;k++){const eid=uid('exp'),date=dAgo(R(1,180)),picks=[...BASE].sort(()=>Math.random()-.5).slice(0,R(1,3));let total=0;
    picks.forEach(([name,type,lo,hi])=>{const qty=R(1,3),unit=R(lo*10,hi*10)*10,color=P(COLORS),size=P(sizesOf(type)),key=keyOf({name,size,color});total+=qty*unit;
      items.push({id:uid('item'),expenseId:eid,name,category:'Clothing',quantity:qty,unitPrice:unit,lineTotal:qty*unit,addToWardrobe:true});
      let w=wmap.get(key);
      if(w){w.cost=Math.round((w.cost*w.quantity+unit*qty)/(w.quantity+qty));w.quantity+=qty;w.purchaseDate=[w.purchaseDate,date].sort()[0]}
      else{w={id:uid('wd'),name,brand:'',category:type,size,color,quantity:qty,condition:P(['New','Good']),cost:unit,purchaseDate:date,sourceExpenseId:eid,createdAt:now,updatedAt:now};wmap.set(key,w)}
      chg.push({id:uid('chg'),wardrobeItemId:w.id,expenseId:eid,change:qty,reason:'Purchase',date})});
    exps.push({id:eid,merchant:P(SHOPS),purchaseDate:date,currency:'MYR',totalAmount:total,category:'Clothing',paymentMethod:P(PAY),notes:'Sample data',receiptId:null,createdAt:now,updatedAt:now})}
  try{await DB.tx(s=>{DB.S.forEach(x=>s(x).clear());exps.forEach(r=>s('expenses').put(r));items.forEach(r=>s('items').put(r));wmap.forEach(r=>s('wardrobe').put(r));chg.forEach(r=>s('changes').put(r))});
    toast('Sample clothing data added');location.hash='#/home';route()}catch(e){toast('Failed: '+e.message)}}

/* ---------- Router ---------- */
const NAVMAP={expense:'expenses',add:'expenses',review:'expenses',done:'expenses',wd:'wardrobe',month:'insights',settings:'home'};
async function route(){const [name='home',arg]=location.hash.slice(2).split('/');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===(NAVMAP[name]||name)));
  try{await (screens[name]||screens.home)(arg)}catch(e){app.innerHTML=`<div class="err" role="alert">Something went wrong: ${esc(e.message)}. Try reloading.</div>`}}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});
route();

</script>
